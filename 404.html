<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex">
<title>여기에는 아무것도 없습니다</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<style>
  :root { --paper: #FAF8F5; --ink: #1A1714; --muted: #6B635A; --accent: #9E5E0A; --line: #E2DCD3;
    --sans: "Pretendard Variable", Pretendard, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --paper: #14110E; --ink: #F1ECE5; --muted: #9E9488; --accent: #F0B25C; --line: #342D26; } }
  * { box-sizing: border-box; }
  html[lang="ko"] { word-break: keep-all; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem 1.25rem;
    background: var(--paper); color: var(--ink); font-family: var(--sans); line-height: 1.7; }
  main { max-width: 30rem; }
  .mark { width: 34px; height: 34px; border-radius: 9px; display: block; margin-bottom: 1.75rem; }
  h1 { font-size: clamp(1.6rem, 1.3rem + 1.4vw, 2.4rem); letter-spacing: -.035em;
    line-height: 1.25; margin: 0 0 .9rem; text-wrap: balance; }
  p { margin: 0 0 .6rem; color: var(--muted); font-size: .95rem; text-wrap: pretty; }
  p.en { font-size: .88rem; }
  a { color: var(--accent); margin-top: 1.5rem; display: inline-block; font-weight: 600; }
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
    <rect width="64" height="64" rx="14" fill="#9E5E0A"/>
    <g fill="#fff">
      <rect x="14.7" y="14.7" width="34.6" height="6.7" rx="3.36"/>
      <rect x="14.7" y="26.8" width="28.2" height="6.7" rx="3.36"/>
      <rect x="14.7" y="38.9" width="21.8" height="6.7" rx="3.36"/>
      <rect x="14.7" y="51.0" width="15.4" height="6.7" rx="3.36"/>
    </g>
  </svg>
  <h1>여기에는 아무것도 없습니다</h1>
  <p>주소가 바뀌었거나, 처음부터 없던 곳입니다. 내려받기와 안내는 모두 첫 페이지에 있습니다.</p>
  <p class="en">This page does not exist. Everything — the download and the docs — is on the front page.</p>
  <a href="https://omnisort.win/">OmniSort 첫 페이지로 →</a>
</main>
</body>
</html>
